# ---- Toolchain versions for Minecraft 26.2 ----
# 26.1 was the first Minecraft release shipped UNOBFUSCATED (official Mojang mappings),
# so there is no `mappings` dependency and Loom does not remap anything.
# These three MUST be a matched set — mismatches die at Bootstrap with
# NoClassDefFoundError before any mod code runs.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.156.0+26.2

# Mod metadata
mod_version=1.0.0
maven_group=net.enderlink
archives_base_name=enderlink
