plugins {
    // 26.1+: the NEW non-remapping loom plugin id (the old one was just "fabric-loom").
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
}

base {
    archivesName = "${project.archives_base_name}-fabric"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // 26.1+: NO `mappings` line — the game ships with official Mojang names already.
    // 26.1+: plain `implementation`, NOT `modImplementation`.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation project(':core')
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    // 26.1+: the build output task is `jar` (was `remapJar`).
    // core is a plain Java project rather than a mod, so its classes are folded in here —
    // otherwise the mod would load and immediately fail to find SculkLinkCore.
    from project(':core').sourceSets.main.output

    from("${rootDir}/LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
