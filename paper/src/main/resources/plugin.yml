name: EnderLink
version: '${version}'
main: net.enderlink.paper.EnderLinkPaper
description: Two-way Discord bridge. Chat, joins, deaths, advancements and mentions.
author: GetJegged
website: https://github.com/GetJegged/enderlink
# Declares which Bukkit API generation this was written against. 1.21 is a conservative floor
# that newer servers still accept. Paper (and forks) only — see README for why not Spigot.
api-version: '1.21'
folia-supported: false

commands:
  discord:
    description: Shows the server's Discord invite link.
    usage: /discord
  link:
    description: Links your Minecraft account to Discord.
    usage: /link
