[[mods]]
modId = "sculklink"
version = "${version}"
displayName = "Sculklink"
authors = "GetJegged"
logoFile = "assets/sculklink/icon.png"
description = '''
Two-way Discord bridge. Joins, leaves, deaths, advancements, chat and mentions go to a Discord
channel; messages typed there appear in in-game chat. Server-side only, and no external
libraries — players need no mods.
'''

[[dependencies.sculklink]]
