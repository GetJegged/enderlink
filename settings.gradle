pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'enderlink'

// core holds every line that does not touch a server API; the rest are thin platform adapters.
include 'core'
include 'fabric'
include 'paper'
